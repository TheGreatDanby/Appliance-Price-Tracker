name: Daily dishwasher price check

on:
  schedule:
    # 02:00 UTC = 12:00 Brisbane time (UTC+10, no daylight saving)
    - cron: "0 2 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed to commit updated data/docs back to the repo

concurrency:
  group: daily-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run price check
        run: node scripts/check-prices.mjs

      - name: Regenerate dashboard
        run: node scripts/generate-dashboard.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily price check $(date -u +%Y-%m-%d)"
            git push
          fi
